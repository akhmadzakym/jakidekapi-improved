<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="modal image css demo.css">
    <title>title</title>
</head>

<body>
<!-- Trigger the Modal -->
<div>
  <img id="myImg" src="images/thumbnails/digita/spcbi.gif" alt="Snow" style="width:100%;max-width:300px">
  <!-- The Modal -->
  <div id="myModal" class="modal">
    
    <!-- The Close Button -->
    <span class="close">&times;</span>

    <!-- Modal Content (The Image) -->
    <img class="modal-content" id="img01">

    <!-- Modal Caption (Image Text) -->
    <div id="caption"></div>
    <div id="paragraph"><p>hdgfjshdgfjhsdbjfhgsdjhvjdshgfjhsdg</p></div>
  </div>
</div>

<div>
  <img id="myImg1" src="images/thumbnails/digita/export202401081434415690.gif" alt="starboy" >
  <!-- The Modal -->
  <div id="myModal1" class="modal1">

    <!-- The Close Button -->
    <span class="close1">&times;</span>

    <!-- Modal Content (The Image) -->
    <img class="modal-content1" id="img02">

    <!-- Modal Caption (Image Text) -->
    <div id="caption1"></div>
</div>
      
<script src="JAVASCRIPT/modal image demo.js"></script>
</body>
</html>
